<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Manager</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --surface-2:#f1f3f6; --border:#e2e5ea; --border-strong:#cfd4dc;
  --text:#1b1f24; --muted:#5d6672; --faint:#8a929d; --accent:#2f5bd3; --accent-ink:#fff; --accent-soft:#e8eefc;
  --pos:#167a43; --neg:#c0392b; --warn:#a15c00; --warn-soft:#fff4e0; --ok-soft:#e6f5ec;
  --a1:#2f5bd3; --a1-soft:#e8eefc; --a2:#0f7d74; --a2-soft:#e2f4f2; --a3:#a3570d; --a3-soft:#fbefe1;
  --shadow:0 6px 24px rgba(16,24,40,.12), 0 1px 3px rgba(16,24,40,.08);
  --radius:8px; --row-h:34px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --surface:#181c21; --surface-2:#1f242a; --border:#2b3138; --border-strong:#3a424b;
    --text:#e6e9ed; --muted:#a3abb5; --faint:#78818c; --accent:#7c9dff; --accent-ink:#0d1117; --accent-soft:#1f2a44;
    --pos:#4cc37f; --neg:#ff7a6b; --warn:#f0b35a; --warn-soft:#3a2c14; --ok-soft:#163223;
    --a1:#7c9dff; --a1-soft:#1f2a44; --a2:#4fc7bb; --a2-soft:#14302d; --a3:#f0a75a; --a3-soft:#3a2a16;
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#181c21; --surface-2:#1f242a; --border:#2b3138; --border-strong:#3a424b;
  --text:#e6e9ed; --muted:#a3abb5; --faint:#78818c; --accent:#7c9dff; --accent-ink:#0d1117; --accent-soft:#1f2a44;
  --pos:#4cc37f; --neg:#ff7a6b; --warn:#f0b35a; --warn-soft:#3a2c14; --ok-soft:#163223;
  --a1:#7c9dff; --a1-soft:#1f2a44; --a2:#4fc7bb; --a2-soft:#14302d; --a3:#f0a75a; --a3-soft:#3a2a16;
  --shadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:5px 10px;white-space:nowrap}
button:hover{background:var(--surface-2)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{filter:brightness(1.07)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--surface-2)}
button.danger{color:var(--neg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text],input[type=search],input[type=number],select{background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;padding:5px 8px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0;vertical-align:middle}

header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px 20px 10px;background:var(--surface);border-bottom:1px solid var(--border)}
header h1{font-size:18px;margin:0;letter-spacing:-.01em}
header .meta{color:var(--muted);font-size:12.5px}
header .spacer{flex:1}
header .actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.status{font-size:12px;color:var(--muted);margin-right:6px}
.status b{color:var(--warn);font-weight:600}

nav.tabs{display:flex;gap:2px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:0;z-index:20}
nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--muted);font-weight:500}
nav.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--surface-2);font-size:11.5px;color:var(--muted);text-align:center}
nav.tabs .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}

main{padding:16px 20px 40px;max-width:100%}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar .grow{flex:1}
.toolbar input[type=search]{width:280px;max-width:100%}
.count{color:var(--muted);font-size:12.5px}
.bulk{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--accent-soft);border-radius:6px;font-size:13px}
.bulk[hidden]{display:none}

.tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 250px);min-height:200px}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
.grid th,.grid td{padding:0 10px;height:var(--row-h);border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.grid thead th{position:sticky;background:var(--surface-2);z-index:2;font-weight:600;font-size:12.5px}
.grid thead tr.h th{top:0;cursor:pointer;user-select:none}
.grid thead tr.h th.nosort{cursor:default}
.grid thead tr.f th{top:var(--row-h);padding:4px 6px;border-bottom:1px solid var(--border-strong)}
.grid thead tr.f input,.grid thead tr.f select{width:100%;min-width:70px;padding:3px 6px;font-size:12px;font-weight:400}
.grid th .arrow{color:var(--faint);margin-left:4px;font-size:11px}
.grid th.sorted .arrow{color:var(--accent)}
.grid td.num,.grid th.num{text-align:right;font-variant-numeric:tabular-nums}
.grid tbody tr:hover td{background:var(--surface-2)}
.grid tbody tr.sel td{background:var(--accent-soft)}
.grid td.c,.grid th.c{width:34px;text-align:center;padding:0 6px}
.grid td.sym{font-weight:600}
.grid td.co{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.grid td.pos{color:var(--pos)} .grid td.neg{color:var(--neg)}
.grid td.act{text-align:right}
.grid td.act button{padding:2px 8px;font-size:12px;margin-left:4px}
.empty{padding:40px;text-align:center;color:var(--muted)}

.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12.5px;color:var(--muted)}
.pager select{padding:2px 4px}

.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:500;border:1px solid transparent;line-height:20px}
button.badge{cursor:pointer}
.badge.a1{background:var(--a1-soft);color:var(--a1);border-color:color-mix(in srgb,var(--a1) 30%,transparent)}
.badge.a2{background:var(--a2-soft);color:var(--a2);border-color:color-mix(in srgb,var(--a2) 30%,transparent)}
.badge.a3{background:var(--a3-soft);color:var(--a3);border-color:color-mix(in srgb,var(--a3) 30%,transparent)}
.badge.none{background:transparent;color:var(--muted);border:1px dashed var(--border-strong)}
.badge.none:hover{color:var(--accent);border-color:var(--accent)}
.cap{display:inline-block;padding:0 7px;border-radius:4px;font-size:11.5px;background:var(--surface-2);color:var(--muted)}
.cap.Large{color:var(--a1)} .cap.Mid{color:var(--a2)} .cap.Small{color:var(--a3)}
.chip{display:inline-block;padding:1px 8px;border-radius:4px;background:var(--surface-2);font-size:12px}

/* summary */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.card h3{margin:0 0 6px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card .big{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.card .big small{font-size:13px;color:var(--muted);font-weight:500}
.card .big.over{color:var(--warn)} .card .big.under{color:var(--warn)}
.card .line{font-size:12.5px;color:var(--muted);margin-top:4px}
.card .line b{color:var(--text);font-weight:600}
.card input[type=number]{width:56px;padding:1px 4px;font-size:12px}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin-top:8px}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.sectors{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sectors .chip{font-size:11.5px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--border-strong);padding:5px 12px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed=true] .count{color:inherit;opacity:.85}
[hidden]{display:none!important}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px}
.col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;min-width:0}
.col>h2{margin:0;padding:10px 12px;font-size:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.zone{padding:8px 10px 10px;border-bottom:1px solid var(--border);min-height:70px;transition:background .12s}
.zone:last-child{border-bottom:0}
.zone h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.zone.over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-4px}
.zone .chips{display:flex;flex-wrap:wrap;gap:5px}
.card-chip{display:inline-flex;gap:6px;align-items:center;padding:3px 8px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);font-size:12px;cursor:grab;user-select:none}
.card-chip:hover{border-color:var(--accent)}
.card-chip.dragging{opacity:.4}
.card-chip.dim{opacity:.25}
.card-chip.hit{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card-chip .s{font-weight:600}
.card-chip .m{color:var(--muted);font-size:11px}
.card-chip .d{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.card-chip .d.Large{background:var(--a1)} .card-chip .d.Mid{background:var(--a2)} .card-chip .d.Small{background:var(--a3)}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}

/* popover / menus / modal / toast */
.pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow);padding:12px;min-width:200px}
.pop .pt{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.mx{border-collapse:collapse}
.mx th{font-size:12px;font-weight:600;padding:4px 6px;text-align:left;color:var(--muted)}
.mx td{padding:3px}
.mx button{width:92px;text-align:center;font-size:12px;padding:6px 4px}
.mx button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mx button .c{display:block;font-size:10.5px;opacity:.75}
.pop .foot{display:flex;justify-content:space-between;margin-top:10px;gap:8px}
.menu{display:flex;flex-direction:column;gap:2px;min-width:240px}
.menu button{border:0;text-align:left;background:none;padding:7px 10px}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.menu .grp{font-size:11.5px;color:var(--faint);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.04em}
.colpick{max-height:60vh;overflow:auto;min-width:260px}
.colpick label{display:flex;gap:8px;align-items:center;padding:3px 4px;font-size:13px;cursor:pointer}
.colpick .grp{font-size:11.5px;color:var(--faint);margin:8px 0 2px;text-transform:uppercase;letter-spacing:.04em}

.backdrop{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:760px;max-width:100%;max-height:calc(100vh - 120px);display:flex;flex-direction:column}
.modal .mh{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.modal .mh h2{margin:0;font-size:16px;flex:1}
.modal .mb{padding:12px 16px;overflow:auto}
.modal .mf{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.results{display:flex;flex-direction:column;margin-top:10px}
.res{display:grid;grid-template-columns:150px 1fr auto auto;gap:10px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--border);font-size:13px}
.res:hover{background:var(--surface-2)}
.res .s{font-weight:600}
.res .m{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.custom{margin-top:14px;border:1px solid var(--border);border-radius:8px;padding:8px 12px}
details.custom summary{cursor:pointer;font-weight:600;font-size:13px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;z-index:70;font-size:13px;max-width:calc(100vw - 32px)}
.toast button{background:transparent;color:inherit;border-color:currentColor;padding:2px 10px}
.toast[hidden]{display:none}

.chg td.before{color:var(--muted)}
#selftest{white-space:pre-wrap;font:12px monospace;padding:20px}

/* backtest tab */
:root{--s1:#2a78d6;--s2:#1baf7a;--s3:#eb6834;--bench:#5f6672;--gridc:#eceef1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#199e70;--s3:#d95926;--bench:#a3abb5;--gridc:#262b31}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#199e70;--s3:#d95926;--bench:#a3abb5;--gridc:#262b31}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;min-width:0}
.panel>h3{margin:0 0 2px;font-size:14.5px;display:flex;align-items:center;gap:6px}
.panel>.sub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.mxwrap{overflow-x:auto}
table.mx2{border-collapse:collapse;width:100%;font-size:13px;min-width:620px}
.mx2 th,.mx2 td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.mx2 th:first-child,.mx2 td:first-child{text-align:left}
.mx2 thead th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;vertical-align:bottom}
.mx2 thead th:first-child{cursor:default}
.mx2 th small{display:block;font-weight:400;color:var(--faint);font-size:11px}
.mx2 .cur{background:var(--accent-soft)}
.mx2 tr.sep td{border-top:2px solid var(--border-strong)}
.mx2 tr.tot td{font-weight:650}
.mx2 td.pos{color:var(--pos)} .mx2 td.neg{color:var(--neg)}
.mx2 td small{display:block;color:var(--faint);font-size:11px;font-weight:400}
.key{display:inline-block;width:18px;height:0;border-top:2px solid currentColor;vertical-align:middle;margin-right:8px;flex:none}
.key.dash{border-top-style:dashed}
.legend2{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);margin:2px 0 8px;align-items:center}
.legend2 label{display:flex;align-items:center;gap:6px;cursor:pointer;margin-left:auto}
.chartbox{position:relative;outline:none}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chartbox .gl{stroke:var(--gridc);stroke-width:1}
.chartbox .base{stroke:var(--border-strong);stroke-width:1}
.chartbox .yl,.chartbox .xl{fill:var(--muted);font-size:11px}
.chartbox .el{fill:var(--text);font-size:12px;font-weight:600}
.chartbox .el tspan{fill:var(--muted);font-weight:400}
.chartbox .leader{stroke:var(--border-strong);stroke-width:1}
.chartbox .xh{stroke:var(--muted);stroke-width:1}
.chartbox .tt{position:absolute;top:6px;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;min-width:250px;z-index:5}
.tt .d{font-weight:650;margin-bottom:4px;color:var(--text)}
.tt .row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:1px 0}
.tt .row span:first-child{display:flex;align-items:center;color:var(--muted)}
.tt .row b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.tt .row i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.btgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.btgrid .panel{margin-bottom:0}
.btgrid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.mini td:first-child{min-width:150px}
table.mini{min-width:520px}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini th,.mini td{padding:5px 6px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.mini th:first-child,.mini td:first-child{text-align:left;white-space:normal}
.mini th{color:var(--muted);font-weight:600;font-size:11.5px}
.mini td.pos{color:var(--pos)} .mini td.neg{color:var(--neg)}
.acard .row2{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--border)}
.acard .row2 span:first-child{color:var(--muted)}
.acard .row2 b{font-variant-numeric:tabular-nums}
.acard .row2 b.pos{color:var(--pos)} .acard .row2 b.neg{color:var(--neg)}
.acard h4{margin:12px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.method{font-size:13px;line-height:1.55}
.method h4{margin:14px 0 4px;font-size:13px}
.method ol,.method ul{padding-left:20px;margin:4px 0}
.method li{margin:3px 0}
.method code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:12px}
.calc{display:grid;grid-template-columns:max-content 1fr;gap:3px 16px;font-size:13px;background:var(--surface-2);padding:10px 12px;border-radius:8px;margin:8px 0;font-variant-numeric:tabular-nums}
.calc span:nth-child(odd){color:var(--muted)}
details.method>summary{cursor:pointer;font-weight:650;font-size:14.5px}

/* sectors tab */
.bars{display:grid;grid-template-columns:minmax(150px,260px) 1fr;gap:6px 12px;align-items:center;font-size:12.5px;position:relative}
.bars .nm{text-align:right;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .nm small{color:var(--faint);margin-left:4px}
.bars .track{position:relative;height:18px}
.bars .bar{position:absolute;top:0;height:18px;background:var(--s1)}
.bars .bar.pos{border-radius:0 4px 4px 0} .bars .bar.neg{border-radius:4px 0 0 4px}
.bars .bar.bm{background:var(--bench)}
.bars .val{position:absolute;top:0;line-height:18px;font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap;font-size:12px}
.bars .zero{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--border-strong)}
.bars .ref{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1px dashed var(--muted);z-index:1}
.bars .row{display:contents}
.bars .row:hover .nm{color:var(--accent)}
.refkey{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 10px}
.grid td.heat{position:relative}
.grid td.na{color:var(--faint)}

/* star / shortlist */
.st{border:0;background:none;padding:0 5px 0 0;font-size:15px;line-height:1;color:var(--faint);cursor:pointer;vertical-align:-1px}
.st:hover{color:var(--warn)} .st.on{color:#e0a100}
:root[data-theme="dark"] .st.on{color:#f5c542}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st.on{color:#f5c542}}
.dm .st{font-size:20px}
/* marks: ★ shortlist / ? doubtful / ✗ rejected */
.st.doubt,.mk.doubt.on{color:#d97706} .st.rej,.mk.rej.on{color:var(--neg)}
.st.doubt,.st.rej{font-weight:800}

<body>
<header>
  <div>
    <h1>Portfolio Manager</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="spacer"></div>
  <div class="actions">
    <span class="status" id="status"></span>
    <button class="ghost" id="undo" title="Undo (Ctrl/Cmd+Z)">↶ Undo</button>
    <button class="ghost" id="redo" title="Redo (Ctrl/Cmd+Shift+Z)">↷ Redo</button>
    <button id="more">State ▾</button>
    <button class="primary" id="dl">⬇ Download CSVs ▾</button>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="view"></main>
<div class="toast" id="toast" hidden></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script id="data" type="application/json">/*DATA*/</script>
<script>
(() => {
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
if (location.hash === '#selftest' && D.suggested) D.assign0 = D.suggested;   // self-test runs against the original suggested lists
const COLS = D.cols, CI = {}; COLS.forEach((c, i) => CI[c.k] = i);
const LISTS = ['Active', 'To Invest', 'ETF / SGB'];
const ACCS = [1, 2, 3];
const AN = a => (D.accounts && D.accounts[a]) || 'Account ' + a;          // display name (ids stay 1-3)
const FN = a => AN(a).replace(/[^\w-]+/g, '_');                             // safe for file names
const SYM = CI['Symbol'];
const STORE = 'portfolio-manager-v1';
const TEST = location.hash === '#selftest';
const VIRT = {
  _chk: {k: '_chk', label: '', t: 'chk', fixed: true},
  _asg: {k: '_asg', label: 'Assigned', t: 'cat', g: 'Portfolio'},
  _list: {k: '_list', label: 'List', t: 'cat', g: 'Portfolio'},
  _act: {k: '_act', label: '', t: 'act', fixed: true},
};
const meta = k => VIRT[k] || COLS[CI[k]];
const label = k => (VIRT[k] ? VIRT[k].label : k);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmtN = (v, d) => v == null ? '' : Number(v).toLocaleString('en-IN', {maximumFractionDigits: d});
const short = s => String(s).replace(/^(NSE|BSE|CUSTOM):/, '');

// ---------- state ----------
let S = {assign: {}, targets: {'Active': 20, 'To Invest': 20, 'ETF / SGB': 9}, custom: [], vis: {}, freeze: {}, stars: {}, doubts: {}, rejects: {}, cmp: []};
let hist = [], fut = [];
let ALL = [], BY = new Map();
function reindex() {
  ALL = D.rows.concat(S.custom);
  BY = new Map(ALL.map(r => [r[SYM], r]));
}
function snapshot() { return JSON.stringify({assign: S.assign, custom: S.custom, targets: S.targets}); }
function restore(js) { const o = JSON.parse(js); S.assign = o.assign; S.custom = o.custom; S.targets = o.targets; reindex(); }
function load() {
  S.assign = JSON.parse(JSON.stringify(D.assign0));
  if (TEST) { reindex(); return; }
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && o.assign) {
        S.custom = o.custom || []; S.targets = Object.assign(S.targets, o.targets || {}); S.vis = o.vis || {}; S.freeze = o.freeze || {}; S.cmp = o.cmp || []; S.stars = o.stars || {}; S.doubts = o.doubts || {}; S.rejects = o.rejects || {};
        if (o.baseline === D.baseline) S.assign = o.assign;           // same starting lists as this build: keep the edits
        else { S.resetNotice = Object.keys(o.assign).length; }        // the build switched to a new baseline (e.g. clean slate): start from it, keep UI preferences
      }
    }
  } catch (e) { /* storage unavailable: start from the built-in lists */ }
  reindex();
  for (const s of Object.keys(S.assign)) if (!BY.has(s)) delete S.assign[s];
}
let saveOk = true;
function save() {
  if (TEST) return;
  S.baseline = D.baseline;
  try { const {resetNotice, ...keep} = S; localStorage.setItem(STORE, JSON.stringify(keep)); saveOk = true; } catch (e) { saveOk = false; }
}
function commit(msg, fn, undoable = true) {
  const before = snapshot();
  fn();
  if (snapshot() === before) return false;
  if (undoable) { hist.push(before); if (hist.length > 200) hist.shift(); fut = []; }
  save(); renderAll();
  if (msg) toast(msg, undoable);
  return true;
}
function undo() { if (!hist.length) return; fut.push(snapshot()); restore(hist.pop()); save(); renderAll(); toast('Undone', false); }
function redo() { if (!fut.length) return; hist.push(snapshot()); restore(fut.pop()); save(); renderAll(); toast('Redone', false); }

// ---------- operations ----------
function assignTo(syms, a, l) {
  let moved = 0;
  return commit(`${syms.length > 1 ? syms.length + ' scrips' : short(syms[0])} → ${AN(a)} · ${l}`, () => {
    for (const s of syms) { if (!BY.has(s)) continue; const cur = S.assign[s]; if (!cur || cur.a !== a || cur.l !== l) moved++; S.assign[s] = {a, l}; }
  });
}
function unassign(syms) {
  const n = syms.filter(s => S.assign[s]).length;
  if (!n) return false;
  return commit(`Removed ${n > 1 ? n + ' scrips' : short(syms.find(s => S.assign[s]))} from accounts`, () => { for (const s of syms) delete S.assign[s]; });
}
function addCustom(rec) {
  const row = COLS.map(c => rec[c.k] ?? null);
  return commit(`Added custom scrip ${short(rec.Symbol)}`, () => { S.custom.push(row); reindex(); if (rec._a) S.assign[rec.Symbol] = {a: rec._a, l: rec._l}; });
}
function accRows(a, l) {
  const out = [];
  for (const [s, v] of Object.entries(S.assign)) if (v.a === a && (!l || v.l === l)) { const r = BY.get(s); if (r) out.push(r); }
  return out;
}
const asgLabel = s => { const v = S.assign[s]; return v ? `${AN(v.a)} · ${v.l}` : 'Unassigned'; };
function val(r, k) {
  if (k === '_asg') return asgLabel(r[SYM]);
  if (k === '_list') { const v = S.assign[r[SYM]]; return v ? v.l : ''; }
  if (k === '_v3') { const x = V3.get(r[SYM]); return x ? x['Score v3'] : null; }
  if (k === '_star') { const m = markOf(r[SYM]), t0 = m && S[MARKS[m].s][r[SYM]]; return t0 ? new Date(t0).toISOString().slice(0, 10) : ''; }
  if (k === '_mark') { const m = markOf(r[SYM]); return m ? MARKS[m].n : ''; }
  return r[CI[k]];
}

// ---------- marks: ★ shortlist / ? doubtful / ✗ rejected (one per stock) ----------
const MARKS = {
  star: {i: '★', n: 'Shortlisted', v: 'Shortlist', s: 'stars'},
  doubt: {i: '?', n: 'Doubtful', v: 'Doubtful', s: 'doubts'},
  rej: {i: '✗', n: 'Rejected', v: 'Reject', s: 'rejects'},
};
const MK = Object.keys(MARKS);
const markOf = sym => MK.find(m => S[MARKS[m].s][sym]) || '';
const isStar = sym => !!S.stars[sym];
const markCount = m => Object.keys(S[MARKS[m].s]).length;
const markTitle = m => m ? `${MARKS[m].n} — click to change` : 'Mark: ★ shortlist · ? doubtful · ✗ reject';
const starBtn = sym => { const m = markOf(sym); return `<button class="st${m ? ' on ' + m : ''}" data-star="${esc(sym)}" aria-haspopup="menu" title="${markTitle(m)}" aria-label="Mark ${esc(short(sym))}">${m ? MARKS[m].i : '☆'}</button>`; };
const markBar = sym => { const c = markOf(sym); return `<span class="mkbar" role="group" aria-label="Mark">${MK.map(m => `<button class="mk ${m}${c === m ? ' on' : ''}" data-mark="${m}" data-msym="${esc(sym)}" aria-pressed="${c === m}" title="${c === m ? 'Clear: ' + MARKS[m].n : MARKS[m].v}">${MARKS[m].i}</button>`).join('')}</span>`; };
function setMark(sym, m) {          // m = 'star' | 'doubt' | 'rej' | '' (clear)
  if (!BY.has(sym)) return;
  for (const k of MK) delete S[MARKS[k].s][sym];
  if (m) S[MARKS[m].s][sym] = Date.now();
  save();
  document.querySelectorAll('[data-star]').forEach(b => { if (b.dataset.star === sym) { b.className = 'st' + (m ? ' on ' + m : ''); b.textContent = m ? MARKS[m].i : '☆'; b.title = markTitle(m); } });
  document.querySelectorAll('[data-msym]').forEach(b => { if (b.dataset.msym === sym) { const on = b.dataset.mark === m; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.title = on ? 'Clear: ' + MARKS[b.dataset.mark].n : MARKS[b.dataset.mark].v; } });
  document.querySelectorAll('tr[data-sym]').forEach(tr => { if (tr.dataset.sym === sym) tr.classList.toggle('rej', m === 'rej'); });
  renderTabs();
  if (tab === 'star') mountShortlist();
}
function toggleStar(sym, force) { const on = force ?? !isStar(sym); if (on) setMark(sym, 'star'); else if (isStar(sym)) setMark(sym, ''); }
function markPop(anchor, sym) {
  const c = markOf(sym);
  openPop(anchor, `<div class="pt">Mark <b>${esc(short(sym))}</b></div><div class="mkmenu">${MK.map(m => `<button class="mk ${m}${c === m ? ' on cur' : ''}" data-pm="${m}"><b>${MARKS[m].i}</b>${MARKS[m].v}</button>`).join('')}${c ? '<button class="mk clr" data-pm="">Clear</button>' : ''}</div>`, p => {
    p.onclick = e => { const b = e.target.closest('[data-pm]'); if (!b) return; closePop(); setMark(sym, b.dataset.pm); };
    p.onkeydown = e => { const k = {s: 'star', d: 'doubt', r: 'rej', x: 'rej', c: ''}[e.key.toLowerCase()]; if (k !== undefined) { e.preventDefault(); closePop(); setMark(sym, k); } };
  });
}
const rowMarkCls = sym => S.rejects[sym] ? ' rej' : '';
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-star], [data-mark]'); if (!t) return;
  e.preventDefault(); e.stopPropagation();
  if (t.dataset.mark) setMark(t.dataset.msym, markOf(t.dataset.msym) === t.dataset.mark ? '' : t.dataset.mark);
  else markPop(t, t.dataset.star);
}, true);

// ---------- filters ----------
function numPred(s) {
  s = s.trim().replace(/,/g, '');
  if (!s) return null;
  let m;
  if ((m = s.match(/^(>=|<=|>|<|=)\s*(-?\d*\.?\d+)$/))) {
    const n = +m[2], op = m[1];
    return v => v != null && (op === '>=' ? v >= n : op === '<=' ? v <= n : op === '>' ? v > n : op === '<' ? v < n : v === n);
  }
  if ((m = s.match(/^(-?\d*\.?\d+)\s*(?:\.\.|to|-)\s*(-?\d*\.?\d+)$/i))) {
    const lo = Math.min(+m[1], +m[2]), hi = Math.max(+m[1], +m[2]);
    return v => v != null && v >= lo && v <= hi;
  }
  if (s === 'blank' || s === 'empty') return v => v == null;
  const t = s.toLowerCase();
  return v => v != null && String(v).toLowerCase().includes(t);
}
function makePred(k, f, M = meta) {
  const m = M(k);
  if (f == null || f === '') return null;
  if (m.t === 'num') return numPred(f);
  if (m.t === 'cat') {
    if (k === '_asg' && f === '*assigned') return v => v !== 'Unassigned';
    if (k === '_asg' && ACCS.some(a => AN(a) === f)) return v => v.startsWith(f + ' · ');
    if (f === '(blank)') return v => v == null || v === '';
    return v => v === f;
  }
  const t = f.toLowerCase();
  return v => v != null && String(v).toLowerCase().includes(t);
}
const SEARCH_KEYS = ['Symbol', 'Company', 'Sector', 'Industry', 'ISIN', 'BSE Code', 'Instrument Type', 'Cap Class'].map(k => CI[k]);

// ---------- glossary (ⓘ tooltips): d = meaning, b = up | down | mid | na, i = rule of thumb ----------
const GL = {
  '_asg': {n: 'Assigned', d: 'Which broking account and list this scrip is in. Click the badge to move it, or ＋ Assign to add it.', b: 'na'},
  '_list': {n: 'List', d: 'Active = currently invested; To Invest = watch-list to buy into; ETF / SGB = the ETF and gold-bond holdings.', b: 'na'},
  'Symbol': {d: 'Exchange ticker. The NSE / BSE tag shows where the data comes from. Click a row for full details.', b: 'na'},
  'Company': {d: 'Registered name of the company, fund or bond series.', b: 'na'},
  'Instrument Type': {d: 'Equity (shares), Equity (SME) (small-company platform, large lot sizes, less liquid), ETF (exchange-traded fund), SGB (Sovereign Gold Bond), G-Sec (government bond), REIT / InvIT (income-paying real-estate / infrastructure trusts).', b: 'na'},
  'Exchange': {d: 'Where it is listed: NSE, BSE, or both (NSE+BSE). Dual-listed scrips can be bought on either exchange.', b: 'na'},
  'BSE Code': {d: 'BSE\'s 6-digit scrip code - handy for searching on BSE or in back-office reports.', b: 'na'},

  'Sector': {d: 'Broad industry group (NSE macro-sector for Nifty 500 stocks; mapped from Yahoo otherwise). ETFs show ETF · underlying asset class.', b: 'na', i: 'Spread a portfolio across many sectors - this is what the account lists are balanced on.'},

  'P/E': {d: 'Price-to-Earnings: share price ÷ earnings per share (trailing 12 months). How many rupees you pay for ₹1 of annual profit.', b: 'down', i: 'Lower = cheaper, but compare with the sector and growth. Nifty 50 usually trades ~18-25. Below ~12 may be cheap (or a value trap); above ~50 needs strong growth to justify. Blank = loss-making.'},
  'P/B': {d: 'Price-to-Book: share price ÷ book value (net worth) per share.', b: 'down', i: 'Key for banks/NBFCs: ~1-3 is typical, below 1 may be cheap or signal bad assets. Asset-light businesses (IT, FMCG) naturally have high P/B.'},

  'Dividend/Share (annual)': {d: 'Dividend paid per share over the last year, in ₹.', b: 'up', i: 'Compare via Dividend Yield (it depends on the price). Check it is regular, not a one-off special dividend.'},
  'Dividend Yield %': {d: 'Annual dividend ÷ share price - the cash income you get per year at today\'s price.', b: 'up', i: '1-3% typical in India; 3-5% = good income (often PSUs, utilities); above ~6% check sustainability (payout ratio, one-off payouts). Growth companies may pay little - that is fine.'},

  'ROE %': {d: 'Return on Equity (latest year): net profit ÷ shareholders\' equity. How efficiently the company turns your capital into profit.', b: 'up', i: '<b>Above 15%</b> good, above 20% excellent, below 10% weak. Very high ROE with high debt is less impressive - check Debt/Equity.'},

  'Promoter chg 1y (pp)': {d: 'Change in promoter holding over about the last year, in percentage points.', b: 'up', i: 'Positive = promoters buying (confidence). Negative = selling - small changes are often noise, but a drop of more than 2-3 points is worth checking.'},

  'Score v3': {d: 'Fund-manager score (0-100, v3.1) built from every cheat-sheet parameter PLUS returns, each graded against its green / yellow / red zone. Pillars: Quality 24 · Growth 17 · Valuation 16 · Safety 14 · Shareholder & income 6 · Returns & trend 23. Red flags cap it: loss-making 35, heavy debt / weak interest cover 45, illiquid 40, P/E > 90 50, negative returns on every horizon 50, 3Y and 5Y CAGR both below −5% 45, 1-year fall worse than −35% 60.', b: 'up', i: '<b>Above 80</b> strong business, fair price and rewarding shareholders; 65-80 solid; 50-65 average; below 50 weak, red-flagged or losing money for investors.'},

const DIR = {up: '↑ Higher is better', down: '↓ Lower is better', mid: '↕ Depends - see the guide', na: ''};
const DIRM = {up: ['↑', 'Higher is better'], down: ['↓', 'Lower is better'], mid: ['~', 'Depends on context - see ⓘ']};
const dirMark = k => { const g = GL[k], m = g && DIRM[g.b]; return m ? `<span class="dirm ${g.b}" title="${m[1]}" aria-label="${m[1]}">${m[0]}</span>` : ''; };
const ii = k => GL[k] ? `<span class="ii" data-ii="${esc(k)}" tabindex="0" role="button" aria-label="What does ${esc(GL[k].n || k)} mean?">i</span>` : '';
const tipEl = document.createElement('div'); tipEl.id = 'tip'; tipEl.hidden = true; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl);
let tipFor = null, tipPinned = false;
function showTip(el, pin) {
  const k = el.dataset.ii, g = GL[k]; if (!g) return;
  if (tipFor && tipFor !== el) tipFor.classList.remove('on');
  tipFor = el; tipPinned = !!pin; el.classList.add('on');
  tipEl.innerHTML = `<span class="t">${esc(g.n || k)}</span>${esc(g.d)}${DIR[g.b] ? `<div class="dir ${g.b}">${DIR[g.b]}</div>` : ''}${g.i ? `<div class="ideal">${g.b === 'na' ? 'Tip' : 'Ideal / rule of thumb'}: ${g.i}</div>` : ''}`;
  tipEl.hidden = false;
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8), y = r.bottom + 8;
  if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 8);
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
function hideTip() { tipEl.hidden = true; tipPinned = false; if (tipFor) tipFor.classList.remove('on'); tipFor = null; }
document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('.ii'); if (el && !tipPinned) showTip(el, false); });
document.addEventListener('mouseout', e => { const el = e.target.closest && e.target.closest('.ii'); if (el && !tipPinned && !el.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('.ii'); if (el) showTip(el, false); });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('.ii') && !tipPinned) hideTip(); });
// capture phase: an ⓘ click must never sort a column, open a row, or toggle a checkbox label
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('.ii');
  if (el) { e.preventDefault(); e.stopPropagation(); tipPinned && tipFor === el ? hideTip() : showTip(el, true); return; }
  if (tipPinned && !tipEl.contains(e.target)) hideTip();
}, true);
document.addEventListener('keydown', e => {
  if (!tipEl.hidden && e.key === 'Escape') { hideTip(); e.stopPropagation(); }
  const el = e.target.closest && e.target.closest('.ii');
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); tipPinned && tipFor === el ? hideTip() : showTip(el, true); }
}, true);
addEventListener('scroll', () => { if (!tipEl.hidden) hideTip(); }, true);

    css += `${q} tbody tr:hover > :nth-child(-n+${n}){background:var(--surface-2)}${q} tbody tr.sel > :nth-child(-n+${n}){background:var(--accent-soft)}${q} tbody tr.idx > :nth-child(-n+${n}){background:var(--surface-2)}`;

    if (toks.length) rows = rows.filter(r => { const hay = T.hay(r).toLowerCase(); return toks.every(t => hay.includes(t)); });
    for (const [k, f] of Object.entries(T.f)) { const p = makePred(k, f, T.M); if (p) rows = rows.filter(r => p(T.V(r, k))); }
    if (T.sort) {

        ${opts.extraTools || ''}
        <span class="grow"></span>

        <button data-r="export" title="Download exactly what this table shows (filtered rows, visible columns)">⬇ Export view</button>

    const q = el.querySelector('[data-r=q]');

    q.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { T.q = q.value; T.page = 0; T.body(); }, 120); });

    el.querySelector('[data-r=cols]').onclick = e => colPicker(e.currentTarget, T);

    th.querySelector('tr.h').onclick = e => {

function rowHtml(r, T) {

    if (k === '_asg') { const v = S.assign[s]; return `<td>${v ? `<button class="badge a${v.a}" data-a="asg" title="Move to another account / list">${esc(AN(v.a))} · ${esc(v.l)}</button>` : `<button class="badge none" data-a="asg">＋ Assign</button>`}</td>`; }
    if (k === '_list') { const v = S.assign[s]; return `<td>${v ? `<button class="badge a${v.a}" data-a="asg" title="Move to another account / list">${esc(v.l)}</button>` : ''}</td>`; }
    if (k === '_v3') { const x = val(r, '_v3'); return `<td class="num heat" style="${tint(x == null ? null : (x - 60) / 1.5)}">${x == null ? '–' : '<b>' + fmtN(x, 1) + '</b>'}</td>`; }
    if (k === '_star') return `<td>${esc(val(r, '_star'))}</td>`;
    if (k === '_mark') { const m = markOf(s); return `<td>${m ? `<span class="st on ${m}" style="cursor:default">${MARKS[m].i}</span>${esc(MARKS[m].n)}` : ''}</td>`; }
    if (k === '_act') return `<td class="act"><button data-a="asg" title="Move to another account or list">⇄ Move</button><button class="danger" data-a="rm" title="Remove from this account">✕ Remove</button></td>`;
    const m = COLS[CI[k]], v = r[CI[k]];
    if (k === 'Symbol') return `<td class="sym" title="Click for details">${starBtn(v)}<span class="tk">${esc(short(v))}</span><span class="cap" style="margin-left:6px;font-weight:400">${esc(String(v).split(':')[0])}</span></td>`;
    if (k === 'Company') return `<td class="co" title="${esc(v)}">${esc(v)}</td>`;

function rowClick(e, T) {
  const b = e.target.closest('button[data-a]');
  if (!b) {
    if (e.target.closest('input, select, a, button, td.c, .ii')) return;
    const tr = e.target.closest('tr[data-sym]'); if (!tr || !BY.has(tr.dataset.sym) || (getSelection && String(getSelection()).length)) return;
    openDetail(tr.dataset.sym, T.filtered().map(T.key));
    return;
  }
  const s = b.closest('tr').dataset.sym;

// ---------- popovers ----------
let popEl = null;
function closePop() { if (popEl) { popEl.remove(); popEl = null; } }
function openPop(anchor, html, wire) {
  closePop();
  popEl = document.createElement('div'); popEl.className = 'pop'; popEl.innerHTML = html; document.body.appendChild(popEl);
  const r = anchor.getBoundingClientRect(), w = popEl.offsetWidth, h = popEl.offsetHeight;
  let x = Math.min(r.left, innerWidth - w - 12), y = r.bottom + 6;
  if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 6);
  popEl.style.left = Math.max(8, x) + 'px'; popEl.style.top = y + 'px';
  wire(popEl);

}
document.addEventListener('mousedown', e => { if (popEl && !popEl.contains(e.target) && !e.target.closest('[data-keep-pop]')) closePop(); });
function assignPop(anchor, syms, after) {

  const counts = {}; for (const v of Object.values(S.assign)) counts[v.a + '|' + v.l] = (counts[v.a + '|' + v.l] || 0) + 1;
  const title = syms.length === 1 ? `<b>${esc(short(syms[0]))}</b> — ${cur ? `now in ${esc(AN(cur.a))} · ${esc(cur.l)}` : 'not in any account'}` : `<b>${syms.length}</b> scrips — choose where to put them`;
  openPop(anchor, `<div class="pt">${title}</div>
    <table class="mx"><tr><th></th>${LISTS.map(l => `<th>${esc(l)}</th>`).join('')}</tr>
    ${ACCS.map(a => `<tr><th><span class="badge a${a}">${esc(AN(a))}</span></th>${LISTS.map(l => {
      const c = counts[a + '|' + l] || 0, t = S.targets[l];
      return `<td><button data-a="${a}" data-l="${esc(l)}" class="${cur && cur.a === a && cur.l === l ? 'cur' : ''}">${cur && cur.a === a && cur.l === l ? 'Current' : 'Put here'}<span class="c">${c}${t ? ' / ' + t : ''}</span></button></td>`;
    }).join('')}</tr>`).join('')}</table>
    <div class="foot">${syms.some(s => S.assign[s]) ? `<button class="danger" data-rm>Remove from accounts</button>` : '<span></span>'}<button class="ghost" data-close>Cancel</button></div>`,
  p => {
    p.querySelectorAll('button[data-a]').forEach(b => b.onclick = () => { closePop(); assignTo(syms, +b.dataset.a, b.dataset.l); if (after) after(); renderAll(); });
    const rm = p.querySelector('[data-rm]'); if (rm) rm.onclick = () => { closePop(); unassign(syms); if (after) after(); renderAll(); };
    p.querySelector('[data-close]').onclick = closePop;
  });
}
function freezePicker(anchor, T) {
  const opts = T.cols.filter(k => k !== '_act');
  openPop(anchor, `<div class="pt">Freeze columns on the left (they stay visible while you scroll sideways)</div><div class="menu">
    <button data-fz=""${!T.freeze ? ' style="font-weight:650"' : ''}>No frozen columns</button><hr>
    ${opts.map(k => `<button data-fz="${esc(k)}"${T.freeze === k ? ' style="font-weight:650"' : ''}>Up to <b>${esc(k === '_chk' ? 'checkbox' : T.L(k))}</b>${T.freeze === k ? ' ✓' : ''}</button>`).join('')}</div>`, p => {
    p.querySelectorAll('[data-fz]').forEach(b => b.onclick = () => { T.freeze = b.dataset.fz || null; S.freeze[T.id] = T.freeze; save(); closePop(); T.applyFreeze(); });
  });
}
function colPicker(anchor, T) {
  const groups = {};
  const pick = T.opts.pick || [VIRT._asg, VIRT._list, ...COLS];
  for (const c of pick) (groups[c.g] = groups[c.g] || []).push(c.k);
  openPop(anchor, `<div class="colpick">${Object.entries(groups).map(([g, ks]) => `<div class="grp">${esc(g)}</div>` + ks.map(k => `<label><input type="checkbox" value="${esc(k)}" ${T.cols.includes(k) ? 'checked' : ''}> ${esc(label(k))}${ii(k)}</label>`).join('')).join('')}</div>
    <div class="foot"><button class="ghost" data-def>Reset to default</button><button data-close>Done</button></div>`, p => {
    p.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => {
      const want = new Set([...p.querySelectorAll('input:checked')].map(x => x.value));
      const order = ['_chk', ...T.defCols.filter(k => want.has(k)), ...pick.map(c => c.k).filter(k => want.has(k) && !T.defCols.includes(k))];
      if (T.defCols.includes('_act')) order.push('_act');
      T.cols = [...new Set(order)];
      for (const k of Object.keys(T.f)) if (!T.cols.includes(k)) delete T.f[k];
      S.vis[T.id] = T.cols; save(); T.head(); T.body();
    });
    p.querySelector('[data-def]').onclick = () => { T.cols = T.defCols.slice(); delete S.vis[T.id]; save(); closePop(); T.head(); T.body(); };
    p.querySelector('[data-close]').onclick = closePop;
  });
}

// ---------- downloads ----------
function csv(rows, cols, pre, V = val, L = label) {
  const q = v => { if (v == null) return ''; const s = String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = [...pre.map(p => p.label), ...cols.map(L)];
  return '﻿' + [head.map(q).join(','), ...rows.map(r => [...pre.map(p => p.get(r)), ...cols.map(k => V(r, k))].map(q).join(','))].join('\r\n') + '\r\n';
}
const ALLC = COLS.map(c => c.k);
function accountCsv(a) {
  const rows = accRows(a).sort((x, y) => LISTS.indexOf(S.assign[x[SYM]].l) - LISTS.indexOf(S.assign[y[SYM]].l) || String(x[SYM]).localeCompare(String(y[SYM])));
  return csv(rows, ALLC, [{label: 'Account', get: () => AN(a)}, {label: 'List', get: r => S.assign[r[SYM]].l}]);
}
function combinedCsv() {
  const rows = Object.keys(S.assign).map(s => BY.get(s)).filter(Boolean).sort((x, y) => { const A = S.assign[x[SYM]], B = S.assign[y[SYM]]; return A.a - B.a || LISTS.indexOf(A.l) - LISTS.indexOf(B.l) || String(x[SYM]).localeCompare(String(y[SYM])); });
  return csv(rows, ALLC, [{label: 'Account', get: r => AN(S.assign[r[SYM]].a)}, {label: 'List', get: r => S.assign[r[SYM]].l}]);
}
function exportView(T) {
  const cols = T.cols.filter(k => k !== '_chk' && k !== '_act');

}

document.getElementById('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (!o || typeof o.assign !== 'object') throw new Error('not a portfolio state file');
    commit('Loaded state from ' + f.name, () => {
      S.custom = Array.isArray(o.custom) ? o.custom.filter(r => Array.isArray(r) && r.length === COLS.length) : [];
      reindex();
      S.assign = {};
      for (const [s, v] of Object.entries(o.assign)) if (BY.has(s) && ACCS.includes(v.a) && LISTS.includes(v.l)) S.assign[s] = {a: v.a, l: v.l};
      if (o.targets) S.targets = Object.assign(S.targets, o.targets);
      for (const m of MK) { const x = o[MARKS[m].s]; if (x && typeof x === 'object') S[MARKS[m].s] = Object.fromEntries(Object.entries(x).filter(([k]) => BY.has(k))); }

    ok(markOf('NSE:WIPRO') === 'rej' && tables.star.filtered().length === 0, 'shortlist: bulk move ? → ✗');

    openDetail('NSE:INFY', ['NSE:INFY']); dEl.querySelector('[data-mark="doubt"]').click();
    ok(markOf('NSE:INFY') === 'doubt' && dEl.querySelector('[data-mark="doubt"]').classList.contains('on'), 'mark: ★ ? ✗ buttons in the stock popup'); closeDetail();
    stView = 'star'; mountView(); tables.star.sel.add('NSE:TCS'); assignTo(['NSE:TCS'], 2, 'Active');
    ok(S.assign['NSE:TCS'] && S.assign['NSE:TCS'].a === 2 && view.textContent.includes('not yet in an account'), 'shortlist: assign from shortlist into an account'); undo();
    [S.stars, S.doubts, S.rejects] = keepS; stView = keepV; tables.star.sel.clear(); tab = 'all'; mountView();
  }
  if (D.cheat) {
    tab = 'cheat'; mountView();
    const sr = view.querySelector('#cheat-host').shadowRoot;
    ok(sr && sr.querySelectorAll('tbody tr:not(.grp)').length >= 28 && sr.textContent.includes('Interest cover') && getComputedStyle(view.querySelector('#cheat-host')).display === 'block', 'cheat sheet tab renders all ratios (isolated)');

  zipAll().arrayBuffer().then(buf => {
    const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    ok(b[0] === 0x50 && b[1] === 0x4b, 'zip signature');
    document.body.innerHTML = '<pre id="selftest">' + out.join('\n') + '\nZIP64:' + btoa(s) + '\nEND</pre>';
  });
}
